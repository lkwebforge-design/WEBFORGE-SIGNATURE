<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Story — WebForge Signature</title>
<meta name="description" content="Explore a WebForge project story — the video, project perspective, responsive website preview and live build.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070908;--panel:#0d110f;--line:rgba(255,255,255,.1);--text:#f4f6f1;--muted:#929c94;--green:#b6ff67;--display:'Manrope',sans-serif;--sans:'DM Sans',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
a{color:inherit}.nav{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 6vw;border-bottom:1px solid var(--line);position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(7,9,8,.72);backdrop-filter:blur(18px)}.brand{text-decoration:none;font:800 12px var(--display);letter-spacing:.12em}.brand b{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid #667067;border-radius:8px;color:var(--green);margin-right:10px}.back{text-decoration:none;font:700 9px var(--display);letter-spacing:.14em;color:#aab3ac}.back:hover{color:var(--green)}
.hero{min-height:100vh;padding:150px 7vw 80px;display:grid;grid-template-columns:.9fr 1.1fr;gap:6vw;align-items:center}.eyebrow{font:700 9px var(--display);letter-spacing:.18em;color:#7e8981}.eyebrow i{display:inline-block;width:22px;height:1px;background:var(--green);vertical-align:middle;margin-right:9px}.hero h1{font:800 clamp(52px,7vw,105px)/.88 var(--display);letter-spacing:-.075em;margin:22px 0}.hero h1 em{font-family:Georgia,serif;font-weight:400;color:var(--green)}.hero-copy>p{max-width:500px;color:var(--muted);font-size:16px;line-height:1.7}.pill{display:inline-flex;margin-top:25px;padding:10px 13px;border:1px solid var(--line);border-radius:999px;color:#aab4ac;font:600 8px var(--display);letter-spacing:.12em}
.video{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0b0e0c;aspect-ratio:16/10;box-shadow:0 35px 100px rgba(0,0,0,.42)}.video video{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) contrast(1.04)}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 42%,rgba(0,0,0,.78))}.video-label{position:absolute;left:20px;top:18px;font:700 8px var(--display);letter-spacing:.15em;color:#dfe6e0}.video-caption{position:absolute;left:22px;right:22px;bottom:20px;z-index:2}.video-caption strong{display:block;font:800 20px var(--display);letter-spacing:-.03em}.video-caption small{display:block;margin-top:7px;color:#aeb8b0;font-size:9px}.message{padding:18px 22px;border-left:2px solid var(--green);background:rgba(7,9,8,.68);backdrop-filter:blur(12px);margin-top:16px;font:600 13px/1.5 var(--display);color:#f2f5f1}.note{margin-top:12px;color:#667169;font-size:8px;line-height:1.5}
.story{padding:120px 7vw;background:#0b0f0c}.story-head{display:grid;grid-template-columns:1fr .75fr;gap:6vw;align-items:end;margin-bottom:55px}.story h2{font:800 clamp(42px,5vw,76px)/.92 var(--display);letter-spacing:-.065em;margin:12px 0 0}.story h2 em{font-family:Georgia,serif;font-weight:400;color:var(--green)}.story-head p{max-width:460px;color:var(--muted);line-height:1.8;font-size:13px;margin:0}.story-copy{max-width:820px;margin:0 0 50px;color:#c5cdc7;font-size:15px;line-height:1.9}.screens{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:start}.shot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#111511;box-shadow:0 25px 70px rgba(0,0,0,.24)}.shot img{display:block;width:100%;height:auto;object-fit:cover;background:#111;transition:transform .5s ease}.shot:hover img{transform:scale(1.015)}.shot figcaption{padding:16px 18px;display:flex;justify-content:space-between;font:700 9px var(--display);letter-spacing:.12em}.shot figcaption span:last-child{color:#68736b}.portfolio-view{padding:120px 7vw;background:#070908}.portfolio-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0d110f}.portfolio-image{display:block;width:100%;height:auto;max-height:760px;object-fit:cover;object-position:top;background:#111}.portfolio-meta{padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:25px}.portfolio-meta strong{font:800 22px var(--display);letter-spacing:-.03em}.portfolio-meta small{display:block;color:#707a72;font:700 8px var(--display);letter-spacing:.14em;margin-top:7px}.portfolio-meta .btn{margin:0}.story-label{font:700 8px var(--display);letter-spacing:.15em;color:#7e8981}
.details{padding:110px 7vw}.details-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.detail{padding:28px 25px 10px 0;border-right:1px solid var(--line);margin-right:25px}.detail:last-child{border:0}.detail b{display:block;color:var(--green);font:700 9px var(--display);letter-spacing:.14em;margin-bottom:35px}.detail h3{font:700 20px var(--display);margin:0 0 10px}.detail p{font-size:12px;color:#7e8981;line-height:1.7;margin:0}
.cta{padding:130px 7vw;background:var(--green);color:#0a100b;text-align:center}.cta h2{font:800 clamp(48px,7vw,100px)/.88 var(--display);letter-spacing:-.08em;margin:0}.cta h2 em{font-family:Georgia,serif;font-weight:400}.cta p{max-width:520px;margin:25px auto;color:#344831;line-height:1.6;font-size:14px}.btn{display:inline-block;padding:15px 19px;background:#091009;color:white;text-decoration:none;border-radius:5px;font:700 10px var(--display);letter-spacing:.1em;margin-top:10px}
footer{padding:24px 7vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:#586159;font:700 8px var(--display);letter-spacing:.14em}
@media(max-width:850px){.hero{grid-template-columns:1fr;padding-top:125px}.story-head{display:block}.story-head p{margin-top:25px}.screens{grid-template-columns:1fr}.details-grid{grid-template-columns:1fr}.detail{border-right:0;border-bottom:1px solid var(--line);padding-bottom:28px;margin-right:0}.portfolio-meta{align-items:flex-start;flex-direction:column}.portfolio-meta .btn{margin-top:5px}.hero h1{font-size:62px}}
@media(max-width:600px){.nav{padding:0 20px}.hero,.story,.details,.portfolio-view,.cta{padding-left:20px;padding-right:20px}.hero{padding-top:115px}.video{aspect-ratio:9/12}.video-caption strong{font-size:17px}.message{font-size:11px}.story-copy{font-size:13px;line-height:1.8}.portfolio-image{max-height:none}.portfolio-meta{padding:22px}.portfolio-meta strong{font-size:19px}footer{padding:20px;gap:12px;flex-wrap:wrap}}
</style>
</head>
<body>
<header class="nav"><a class="brand" href="./"><b>W</b>WEBFORGE <span style="color:#6e786f">SIGNATURE</span></a><a class="back" href="./#work">← BACK TO WORK</a></header>
<main id="app"></main>
<footer><span>© 2026 WEBFORGE SIGNATURE</span><span>DESIGN · BUILD · LAUNCH</span><span>COLOMBO · SRI LANKA</span></footer>
<script>
const projects={
moss:{name:'Moss & Mug',category:'CAFE / HOSPITALITY',video:'https://videos.pexels.com/video-files/4426906/4426906-uhd_3840_2160_25fps.mp4',img:'assets/portfolio-cafe.svg',url:'https://lkwebforge-design.github.io/webforge-3d-lab/cafe/',title:'Good things take time.',message:'The goal was to make the café feel welcoming before the first visit. The visual direction keeps the experience warm, calm and easy to explore. The menu is given enough space to become part of the brand rather than just a list of items. The layout guides visitors naturally from the atmosphere into the offer. Mobile interactions stay simple so customers can reach the important information quickly. The final result feels like a digital extension of the café itself.',details:['Warm visual direction','Menu-focused experience','Mobile-first customer journey']},
nova:{name:'Nova Studio',category:'CREATIVE / PORTFOLIO',video:'https://videos.pexels.com/video-files/35315449/14961902_2160_3840_50fps.mp4',img:'assets/portfolio-nova.svg',url:'https://lkwebforge-design.github.io/webforge-3d-lab/',title:'A portfolio with a point of view.',message:'Nova needed a digital presence with the same confidence as a creative studio. The design uses strong typography and movement to create an immediate point of view. Content is given room to breathe so the work remains the focus. Transitions add energy without turning the experience into visual noise. The structure makes it easy to move from the introduction into selected work. The final direction feels expressive, modern and intentionally crafted.',details:['Editorial art direction','Motion-led presentation','Portfolio storytelling']},
arc:{name:'Arc House',category:'ARCHITECTURE / LUXURY',video:'https://videos.pexels.com/video-files/10375421/10375421-hd_1920_1080_30fps.mp4',img:'assets/portfolio-arc.svg',url:'https://lkwebforge-design.github.io/aerova-freezy/index.html',title:'Form meets light.',message:'Arc House was designed around restraint rather than decoration. Large imagery establishes the architectural character from the first screen. Generous spacing gives every project room to breathe. Typography provides structure while staying quiet enough to support the photography. Navigation remains simple so the work never gets buried. The result is a premium presentation built around clarity, proportion and atmosphere.',details:['Luxury visual system','Project-led navigation','Image-first presentation']},
lume:{name:'Lumé Beauty Studio',category:'SALON / BEAUTY',video:'https://videos.pexels.com/video-files/8830516/8830516-uhd_3840_2160_25fps.mp4',img:'assets/portfolio-lume.svg',url:'https://lkwebforge-design.github.io/WEBFORGE-salon/',title:'Beauty, with intention.',message:'Lumé needed to communicate premium beauty without becoming overly complicated. The visual language uses softness, contrast and careful spacing to create a refined first impression. Services remain easy to discover while the appointment journey stays visible. The page structure is designed to move visitors from inspiration toward action. Responsive layouts keep the same polished feeling across smaller screens. The final experience feels elegant, modern and ready for real customer bookings.',details:['Premium salon identity','Appointment-focused CTA','Elegant responsive layout']},
aura:{name:'AURA Private Island Retreat',category:'RESORT / HOSPITALITY',video:'https://videos.pexels.com/video-files/7820473/7820473-hd_1920_1080_25fps.mp4',img:'assets/portfolio-aura.svg',url:'https://lkwebforge-design.github.io/aerova-freezy/aura/',title:'Stay in the extraordinary.',message:'AURA was approached as a destination story rather than a standard hotel website. The experience leads with atmosphere so visitors can imagine the stay before they start comparing details. Cinematic imagery creates emotion while the layout keeps the journey clear. Sections are paced to reveal the retreat gradually instead of presenting everything at once. The calls to action remain visible without interrupting the luxury feeling. The result is an immersive digital experience designed to make the destination memorable.',details:['Immersive destination story','Luxury hospitality direction','Conversion-led exploration']},
volt:{name:'VOLT Fitness',category:'FITNESS / PERFORMANCE',video:'https://videos.pexels.com/video-files/6547808/6547808-uhd_2160_3840_24fps.mp4',img:'assets/portfolio-volt.svg',url:'https://lkwebforge-design.github.io/volt-fitness/',title:'Build your edge.',message:'VOLT needed a digital identity that felt energetic from the first second. Strong typography and bold composition create a sense of movement and performance. The content focuses on what members can achieve rather than simply listing facilities. Calls to action are positioned around the natural decision points in the journey. Mobile layouts keep the training message direct and easy to act on. The final experience is built to turn motivation into the next step.',details:['Performance-led identity','Strong mobile CTA','Training-focused storytelling']}
};
const key=new URLSearchParams(location.search).get('project')||'moss';const p=projects[key]||projects.moss;
document.title=p.name+' — WebForge Signature';
document.getElementById('app').innerHTML=`
<section class="hero"><div class="hero-copy"><div class="eyebrow"><i></i>${p.category}</div><h1>${p.name}<br><em>${p.title}</em></h1><p>See the thinking behind the build — from the visual direction to the finished website experience.</p><span class="pill">PROJECT STORY · WEBFORGE SIGNATURE</span></div><div><div class="video"><video autoplay muted loop playsinline controlslist="nodownload" src="${p.video}"></video><div class="shade"></div><div class="video-label">PROJECT VIDEO · ${p.name.toUpperCase()}</div><div class="video-caption"><strong>${p.title}</strong><small>${p.category}</small></div></div><div class="message">${p.message}</div><div class="note">The video is industry-matched visual reference footage. It is not presented as a recorded client testimonial.</div></div></section>
<section class="story"><div class="story-head"><div><div class="eyebrow"><i></i>THE WEBSITE</div><h2>See the<br><em>finished view.</em></h2></div><p>Clean visual captures replace the heavy embedded previews, so the actual website can be understood quickly without slowing down the page.</p></div><p class="story-copy">${p.message}</p><div class="screens"><figure class="shot"><img src="https://image.thum.io/get/noanimate/width/1200/crop/820/${p.url}" alt="${p.name} website hero screenshot" loading="lazy"><figcaption><span>WEBSITE VIEW / HERO</span><span>01</span></figcaption></figure><figure class="shot"><img src="https://image.thum.io/get/noanimate/width/900/crop/1200/${p.url}" alt="${p.name} website extended screenshot" loading="lazy"><figcaption><span>WEBSITE VIEW / EXTENDED</span><span>02</span></figcaption></figure></div></section>
<section class="details"><div class="details-grid">${p.details.map((d,i)=>'<div class="detail"><b>0'+(i+1)+'</b><h3>'+d+'</h3><p>Designed as part of the '+p.name+' digital experience.</p></div>').join('')}</div></section>
<section class="portfolio-view"><div class="story-label">PORTFOLIO VIEW · ${p.name.toUpperCase()}</div><div class="portfolio-card"><img class="portfolio-image" src="https://image.thum.io/get/noanimate/width/1400/crop/1500/${p.url}" alt="${p.name} portfolio view" loading="lazy"><div class="portfolio-meta"><div><strong>${p.name}</strong><small>${p.category}</small></div><a class="btn" href="${p.url}" target="_blank" rel="noopener">OPEN LIVE WEBSITE →</a></div></div></section>
<section class="cta"><h2>Explore the<br><em>live build.</em></h2><p>See the complete website that this project story represents, then come back when you're ready for your own.</p><a class="btn" href="${p.url}" target="_blank" rel="noopener">VIEW LIVE WEBSITE →</a></section>`;
</script>
</body></html>
