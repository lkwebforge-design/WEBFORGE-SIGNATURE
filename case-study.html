<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Story — WebForge Signature</title>
<meta name="description" content="Explore a WebForge project story — the video, project perspective, responsive website preview and live build.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070908;--panel:#0d110f;--line:rgba(255,255,255,.1);--text:#f4f6f1;--muted:#929c94;--green:#b6ff67;--display:'Manrope',sans-serif;--sans:'DM Sans',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
a{color:inherit}.nav{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 6vw;border-bottom:1px solid var(--line);position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(7,9,8,.72);backdrop-filter:blur(18px)}.brand{text-decoration:none;font:800 12px var(--display);letter-spacing:.12em}.brand b{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid #667067;border-radius:8px;color:var(--green);margin-right:10px}.back{text-decoration:none;font:700 9px var(--display);letter-spacing:.14em;color:#aab3ac}.back:hover{color:var(--green)}
.hero{min-height:100vh;padding:150px 7vw 80px;display:grid;grid-template-columns:.9fr 1.1fr;gap:6vw;align-items:center}.eyebrow{font:700 9px var(--display);letter-spacing:.18em;color:#7e8981}.eyebrow i{display:inline-block;width:22px;height:1px;background:var(--green);vertical-align:middle;margin-right:9px}.hero h1{font:800 clamp(52px,7vw,105px)/.88 var(--display);letter-spacing:-.075em;margin:22px 0}.hero h1 em{font-family:Georgia,serif;font-weight:400;color:var(--green)}.hero-copy>p{max-width:500px;color:var(--muted);font-size:16px;line-height:1.7}.pill{display:inline-flex;margin-top:25px;padding:10px 13px;border:1px solid var(--line);border-radius:999px;color:#aab4ac;font:600 8px var(--display);letter-spacing:.12em}
.video{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0b0e0c;aspect-ratio:16/10;box-shadow:0 35px 100px rgba(0,0,0,.42)}.video video{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) contrast(1.04)}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 42%,rgba(0,0,0,.78))}.video-label{position:absolute;left:20px;top:18px;font:700 8px var(--display);letter-spacing:.15em;color:#dfe6e0}.video-caption{position:absolute;left:22px;right:22px;bottom:20px;z-index:2}.video-caption strong{display:block;font:800 20px var(--display);letter-spacing:-.03em}.video-caption small{display:block;margin-top:7px;color:#aeb8b0;font-size:9px}.message{padding:18px 22px;border-left:2px solid var(--green);background:rgba(7,9,8,.68);backdrop-filter:blur(12px);margin-top:16px;font:600 13px/1.5 var(--display);color:#f2f5f1}.note{margin-top:12px;color:#667169;font-size:8px;line-height:1.5}
.proof{padding:120px 7vw;background:#0b0f0c}.proof-head{display:flex;justify-content:space-between;gap:40px;align-items:end;margin-bottom:55px}.proof h2{font:800 clamp(42px,5vw,76px)/.92 var(--display);letter-spacing:-.065em;margin:12px 0 0}.proof h2 em{font-family:Georgia,serif;font-weight:400;color:var(--green)}.proof-head p{max-width:360px;color:var(--muted);line-height:1.7;font-size:13px}.screens{display:grid;grid-template-columns:1fr 1fr;gap:22px}.shot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#111511}.shot img{display:block;width:100%;height:auto;min-height:300px;object-fit:cover;background:#111}.live-frame{width:100%;height:430px;border:0;display:block;background:#111}.mobile-frame{height:520px;width:78%;margin:0 auto;display:block;border:0;background:#111}.shot.mobile-shot{display:flex;flex-direction:column}.shot figcaption{padding:16px 18px;display:flex;justify-content:space-between;font:700 9px var(--display);letter-spacing:.12em}.shot figcaption span:last-child{color:#68736b}
.details{padding:110px 7vw}.details-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.detail{padding:28px 25px 10px 0;border-right:1px solid var(--line);margin-right:25px}.detail:last-child{border:0}.detail b{display:block;color:var(--green);font:700 9px var(--display);letter-spacing:.14em;margin-bottom:35px}.detail h3{font:700 20px var(--display);margin:0 0 10px}.detail p{font-size:12px;color:#7e8981;line-height:1.7;margin:0}
.cta{padding:130px 7vw;background:var(--green);color:#0a100b;text-align:center}.cta h2{font:800 clamp(48px,7vw,100px)/.88 var(--display);letter-spacing:-.08em;margin:0}.cta h2 em{font-family:Georgia,serif;font-weight:400}.cta p{max-width:520px;margin:25px auto;color:#344831;line-height:1.6;font-size:14px}.btn{display:inline-block;padding:15px 19px;background:#091009;color:white;text-decoration:none;border-radius:5px;font:700 10px var(--display);letter-spacing:.1em;margin-top:10px}
footer{padding:24px 7vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:#586159;font:700 8px var(--display);letter-spacing:.14em}
@media(max-width:850px){.hero{grid-template-columns:1fr;padding-top:125px}.proof-head{display:block}.proof-head p{margin-top:25px}.screens{grid-template-columns:1fr}.details-grid{grid-template-columns:1fr}.detail{border-right:0;border-bottom:1px solid var(--line);padding-bottom:28px;margin-right:0}.hero h1{font-size:62px}}
@media(max-width:600px){.nav{padding:0 20px}.hero,.proof,.details,.cta{padding-left:20px;padding-right:20px}.hero{padding-top:115px}.video{aspect-ratio:9/12}.video-caption strong{font-size:17px}.message{font-size:11px}.live-frame{height:360px}.mobile-frame{height:540px;width:92%}footer{padding:20px;gap:12px;flex-wrap:wrap}}
</style>
</head>
<body>
<header class="nav"><a class="brand" href="./"><b>W</b>WEBFORGE <span style="color:#6e786f">SIGNATURE</span></a><a class="back" href="./#work">← BACK TO WORK</a></header>
<main id="app"></main>
<footer><span>© 2026 WEBFORGE SIGNATURE</span><span>DESIGN · BUILD · LAUNCH</span><span>COLOMBO · SRI LANKA</span></footer>
<script>
const projects={
moss:{name:'Moss & Mug',category:'CAFE / HOSPITALITY',video:'https://videos.pexels.com/video-files/4426906/4426906-uhd_3840_2160_25fps.mp4',img:'assets/portfolio-cafe.svg',url:'https://lkwebforge-design.github.io/webforge-3d-lab/cafe/',title:'Good things take time.',message:'A warm digital experience built to make the café feel welcoming before the first visit — with the menu, atmosphere and brand story taking centre stage.',details:['Warm visual direction','Menu-focused experience','Mobile-first customer journey']},
nova:{name:'Nova Studio',category:'CREATIVE / PORTFOLIO',video:'https://videos.pexels.com/video-files/35315449/14961902_2160_3840_50fps.mp4',img:'assets/portfolio-nova.svg',url:'https://lkwebforge-design.github.io/webforge-3d-lab/',title:'A portfolio with a point of view.',message:'A bold creative-studio direction designed around movement, visual identity and a memorable first impression.',details:['Editorial art direction','Motion-led presentation','Portfolio storytelling']},
arc:{name:'Arc House',category:'ARCHITECTURE / LUXURY',video:'https://videos.pexels.com/video-files/10375421/10375421-hd_1920_1080_30fps.mp4',img:'assets/portfolio-arc.svg',url:'https://lkwebforge-design.github.io/aerova-freezy/index.html',title:'Form meets light.',message:'A restrained architecture experience where imagery, spacing and typography do the heavy lifting — giving the work room to breathe.',details:['Luxury visual system','Project-led navigation','Image-first presentation']},
lume:{name:'Lumé Beauty Studio',category:'SALON / BEAUTY',video:'https://videos.pexels.com/video-files/8830516/8830516-uhd_3840_2160_25fps.mp4',img:'assets/portfolio-lume.svg',url:'https://lkwebforge-design.github.io/WEBFORGE-salon/',title:'Beauty, with intention.',message:'A refined salon experience built to turn atmosphere into action, with a premium visual language and a clear appointment journey.',details:['Premium salon identity','Appointment-focused CTA','Elegant responsive layout']},
aura:{name:'AURA Private Island Retreat',category:'RESORT / HOSPITALITY',video:'https://videos.pexels.com/video-files/7820473/7820473-hd_1920_1080_25fps.mp4',img:'assets/portfolio-aura.svg',url:'https://lkwebforge-design.github.io/aerova-freezy/aura/',title:'Stay in the extraordinary.',message:'A cinematic hospitality experience designed to sell the feeling of the destination — before the guest ever arrives.',details:['Immersive destination story','Luxury hospitality direction','Conversion-led exploration']},
volt:{name:'VOLT Fitness',category:'FITNESS / PERFORMANCE',video:'https://videos.pexels.com/video-files/6547808/6547808-uhd_2160_3840_24fps.mp4',img:'assets/portfolio-volt.svg',url:'https://lkwebforge-design.github.io/volt-fitness/',title:'Build your edge.',message:'A high-energy fitness experience focused on performance, confidence and a clear path from first impression to starting training.',details:['Performance-led identity','Strong mobile CTA','Training-focused storytelling']}
};
const key=new URLSearchParams(location.search).get('project')||'moss';const p=projects[key]||projects.moss;
document.title=p.name+' — WebForge Signature';
document.getElementById('app').innerHTML=`
<section class="hero"><div class="hero-copy"><div class="eyebrow"><i></i>${p.category}</div><h1>${p.name}<br><em>${p.title}</em></h1><p>See the thinking behind the build — from the visual direction to the finished website experience.</p><span class="pill">PROJECT STORY · WEBFORGE SIGNATURE</span></div><div><div class="video"><video autoplay muted loop playsinline controlslist="nodownload" src="${p.video}"></video><div class="shade"></div><div class="video-label">PROJECT VIDEO · ${p.name.toUpperCase()}</div><div class="video-caption"><strong>${p.title}</strong><small>${p.category}</small></div></div><div class="message">${p.message}</div><div class="note">The video is industry-matched visual reference footage. It is not presented as a recorded client testimonial.</div></div></section>
<section class="proof"><div class="proof-head"><div><div class="eyebrow"><i></i>THE WEBSITE</div><h2>Now see what<br><em>they got.</em></h2></div><p>The visual proof comes next: a live preview of the actual website on desktop and mobile, followed by the finished project link.</p></div><div class="screens"><figure class="shot"><iframe class="live-frame" src="${p.url}" title="${p.name} live website desktop preview" loading="lazy"></iframe><figcaption><span>LIVE SITE / DESKTOP PREVIEW</span><span>01</span></figcaption></figure><figure class="shot mobile-shot"><iframe class="mobile-frame" src="${p.url}" title="${p.name} live website mobile preview" loading="lazy"></iframe><figcaption><span>LIVE SITE / MOBILE PREVIEW</span><span>02</span></figcaption></figure></div></section>
<section class="details"><div class="details-grid">${p.details.map((d,i)=>'<div class="detail"><b>0'+(i+1)+'</b><h3>'+d+'</h3><p>Designed as part of the '+p.name+' digital experience.</p></div>').join('')}</div></section>
<section class="cta"><h2>Explore the<br><em>live build.</em></h2><p>See the complete website that this project story represents, then come back when you're ready for your own.</p><a class="btn" href="${p.url}" target="_blank" rel="noopener">VIEW LIVE WEBSITE →</a></section>`;
</script>
</body></html>
